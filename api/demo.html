<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-api · Demo</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #6ea8fe;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  textarea, input {
    width: 100%;
    background: #0d0f14;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font: inherit;
    resize: vertical;
  }
  textarea { min-height: 88px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    margin-top: 14px;
    width: 100%;
    background: var(--accent);
    color: #08111f;
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .out { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
  }
  .b-pending { color: var(--muted); }
  .b-running { color: var(--accent); }
  .b-done { color: var(--ok); border-color: var(--ok); }
  .b-failed { color: var(--err); border-color: var(--err); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>agent-api</h1>
    <p class="sub">异步 LLM 任务 · 提交后轮询结果。接口文档见 <a href="/healthz">/healthz</a> · <a href="/metrics">/metrics</a></p>

    <div class="card">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="例如：帮我算一下 (12+8)*3 是多少？现在几点了？"></textarea>
      <div class="row" style="margin-top:12px">
        <div>
          <label for="token">Bearer Token（可选，生产环境必填）</label>
          <input id="token" type="text" placeholder="留空则开发模式直发" autocomplete="off" />
        </div>
      </div>
      <button id="run">提交任务</button>
    </div>

    <div class="card">
      <label>结果</label>
      <div id="status" class="badge b-pending">空闲</div>
      <div id="out" class="out" style="margin-top:10px">—</div>
      <div id="meta" class="meta"></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

async function postRun(prompt, token) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch("/run", {
    method: "POST",
    headers,
    body: JSON.stringify({ prompt }),
  });
  if (!res.ok) throw new Error("提交失败：" + res.status);
  const data = await res.json();
  return data.task_id;
}

async function getTask(id, token) {
  const headers = {};
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch("/tasks/" + id, { headers });
  if (!res.ok) throw new Error("查询失败：" + res.status);
  return res.json();
}

async function poll(id, token) {
  for (;;) {
    const task = await getTask(id, token);
    setBadge(task.status);
    if (task.status === "done") {
      $("out").textContent = task.result || "(空)";
      $("meta").textContent = "task_id: " + id;
      stop("done");
      return;
    }
    if (task.status === "failed") {
      $("out").textContent = task.error || "执行失败";
      $("meta").textContent = "task_id: " + id;
      stop("failed");
      return;
    }
    $("out").textContent = "状态：" + task.status + " …";
    await new Promise((r) => setTimeout(r, 1000));
  }
}

let timer = null;
function stop(finalStatus) {
  $("run").disabled = false;
  if (timer) { clearInterval(timer); timer = null; }
}

function setBadge(status) {
  const el = $("status");
  el.className = "badge b-" + status;
  el.textContent = status;
}

$("run").addEventListener("click", async () => {
  const prompt = $("prompt").value.trim();
  const token = $("token").value.trim();
  if (!prompt) { alert("请先填写 prompt"); return; }

  $("run").disabled = true;
  setBadge("pending");
  $("out").textContent = "提交中…";
  $("meta").textContent = "";

  try {
    const id = await postRun(prompt, token);
    $("out").textContent = "已提交，轮询中…";
    poll(id, token);
  } catch (e) {
    setBadge("failed");
    $("out").textContent = String(e.message || e);
    stop("failed");
  }
});
</script>
</body>
</html>
